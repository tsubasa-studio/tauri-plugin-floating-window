<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floating Window</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .bubble {
        width: 120px;
        height: 120px;
        border-radius: 32px;
        background: radial-gradient(
          circle at top left,
          #48b5ff 0%,
          #2c7be5 60%,
          #1d4ed8 100%
        );
        box-shadow: 0 28px 52px rgba(15, 23, 42, 0.35);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .bubble::before {
        content: "";
        position: absolute;
        top: -16px;
        right: -16px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        filter: blur(10px);
      }

      .icon {
        width: 56px;
        height: 56px;
      }

      svg {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="bubble">
      <div class="icon">
        <svg
          viewBox="0 0 120 120"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient
              id="glow"
              x1="0"
              y1="0"
              x2="120"
              y2="120"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#FDE68A" />
              <stop offset="100%" stop-color="#F59E0B" />
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="32" fill="url(#glow)" />
          <path
            d="M38 60C38 50.0589 46.059 42 56 42H64C73.9409 42 82 50.0589 82 60V72C82 81.9411 73.9409 90 64 90H56C46.059 90 38 81.9411 38 72V60Z"
            fill="white"
            opacity="0.95"
          />
          <path
            d="M56 42C49.3726 42 44 47.3726 44 54V72C44 78.6274 49.3726 84 56 84H64C70.6274 84 76 78.6274 76 72V54C76 47.3726 70.6274 42 64 42H56Z"
            fill="#1D4ED8"
          />
          <path
            d="M50 48H70"
            stroke="white"
            stroke-width="6"
            stroke-linecap="round"
            opacity="0.85"
          />
          <path
            d="M50 72H70"
            stroke="white"
            stroke-width="6"
            stroke-linecap="round"
            opacity="0.85"
          />
        </svg>
      </div>
    </div>
  </body>
</html>
